<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFix Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(228,154,47,0.08), transparent 30%),
                radial-gradient(circle at bottom right, rgba(16,69,52,0.35), transparent 35%),
                #061a14;
            color: #f7f4eb;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 75px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(3,17,13,0.85);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
            color: #e49a2f;
            letter-spacing: 0.5px;
        }

        .admin-label {
            color: #aebdb5;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            padding: 42px;
            border-radius: 24px;
            background:
                linear-gradient(145deg, #0c3a2b, #09231a);
            border: 1px solid rgba(228,154,47,0.22);
            box-shadow:
                0 25px 70px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .admin-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(228,154,47,0.12);
            border: 1px solid rgba(228,154,47,0.3);
            font-size: 30px;
        }

        .login-card h1 {
            text-align: center;
            color: #e49a2f;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aebdb5;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #f7f4eb;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #061a14;
            color: #f7f4eb;
            font-size: 15px;
            outline: none;
            transition: 0.25s;
        }

        input::placeholder {
            color: #6f8178;
        }

        input:focus {
            border-color: #e49a2f;
            box-shadow: 0 0 0 3px rgba(228,154,47,0.08);
        }

        .login-btn {
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #e49a2f;
            color: #10291f;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.25s;
        }

        .login-btn:hover {
            background: #f5b64e;
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        .error {
            display: block;
            background: rgba(180,50,50,0.15);
            border: 1px solid rgba(220,80,80,0.3);
            color: #ffb3b3;
        }

        .success {
            display: block;
            background: rgba(50,160,100,0.12);
            border: 1px solid rgba(80,190,120,0.3);
            color: #a8e6c1;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #aebdb5;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .back-home:hover {
            color: #e49a2f;
        }

        .security-note {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            text-align: center;
            color: #72857c;
            font-size: 12px;
            line-height: 1.6;
        }

        footer {
            padding: 22px;
            text-align: center;
            background: #03110d;
            color: #718078;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 20px;
            }

            .login-card {
                padding: 30px 22px;
            }

            .logo {
                font-size: 23px;
            }

            .admin-label {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">QuickFix</div>
    <div class="admin-label">Admin Panel</div>
</header>

<main>

    <div class="login-card">

        <div class="admin-icon">👑</div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Welcome to the QuickFix management dashboard.
            Sign in to monitor your platform.
        </p>

        <form id="adminLoginForm">

            <div class="input-group">
                <label for="email">Admin Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    required
                >
            </div>

            <button type="submit" class="login-btn" id="loginButton">
                Login to Admin Panel
            </button>

        </form>

        <div id="message" class="message"></div>

        <a href="home.html" class="back-home">
            ← Back to QuickFix Home
        </a>

        <div class="security-note">
            🔒 This area is restricted to QuickFix administrators.
        </div>

    </div>

</main>

<footer>
    © 2026 QuickFix | Pranali Bhoyar and Mrunmayi Jadhav
</footer>


<script>

    const API_URL = "https://quickfix.pythonanywhere.com";

    const form = document.getElementById("adminLoginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        message.className = "message";
        message.textContent = "";

        loginButton.disabled = true;
        loginButton.textContent = "Checking...";

        try {

            const response = await fetch(`${API_URL}/api/admin/login`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Invalid admin credentials.");
            }

            /*
                Save admin information locally so the
                dashboard knows that the administrator logged in.
            */
            localStorage.setItem(
                "quickfixAdmin",
                JSON.stringify(data.admin)
            );

            message.className = "message success";
            message.textContent = "Login successful! Opening Admin Dashboard...";

            setTimeout(function() {
                window.location.href = "admin-dashboard.html";
            }, 700);

        } catch (error) {

            console.error("Admin login error:", error);

            message.className = "message error";
            message.textContent =
                error.message ||
                "Unable to connect to QuickFix backend.";

            loginButton.disabled = false;
            loginButton.textContent = "Login to Admin Panel";
        }

    });

</script>

</body>
</html>
