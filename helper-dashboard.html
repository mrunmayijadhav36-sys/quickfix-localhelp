<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickFix Helper Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(228, 154, 47, 0.08), transparent 30%),
                linear-gradient(135deg, #061a14, #09251c, #061a14);
            min-height: 100vh;
            color: #f7f4eb;
        }

        /* ================= HEADER ================= */

        header {
            background: rgba(3, 17, 13, 0.96);
            border-bottom: 1px solid rgba(228, 154, 47, 0.18);
            padding: 24px 20px 28px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
            color: #f7f4eb;
            letter-spacing: 0.3px;
        }

        header p {
            margin: 9px 0 0;
            color: #aebdb5;
            font-size: 15px;
        }

        /* ================= LANGUAGE ================= */

        .language-box {
            margin-top: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .language-box label {
            margin: 0;
            color: #aebdb5;
            font-size: 14px;
            font-weight: bold;
        }

        .language-box select {
            background: #061a14;
            color: #f7f4eb;
            border: 1px solid rgba(228, 154, 47, 0.35);
            border-radius: 10px;
            padding: 9px 13px;
            font-size: 14px;
            cursor: pointer;
        }

        .language-box select:focus {
            outline: none;
            border-color: #e49a2f;
        }

        /* ================= MAIN CONTAINER ================= */

        .container {
            width: 92%;
            max-width: 900px;
            margin: 40px auto;
        }

        /* ================= DASHBOARD CARD ================= */

        .dashboard-card {
            background: linear-gradient(
                145deg,
                #0c3a2b,
                #09231a
            );

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 34px;

            box-shadow:
                0 20px 55px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .dashboard-card h2 {
            color: #f7f4eb;
            margin-top: 0;
            margin-bottom: 28px;
            font-size: 25px;
        }

        /* ================= FORM ================= */

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
            color: #f7f4eb;
        }

        input {
            width: 100%;
            padding: 15px 16px;

            background: #061a14;
            color: #f7f4eb;

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;

            font-size: 16px;
            margin-bottom: 18px;

            transition: 0.25s ease;
        }

        input::placeholder {
            color: #7f9389;
        }

        input:focus {
            outline: none;

            border-color: #e49a2f;

            box-shadow:
                0 0 0 3px rgba(228, 154, 47, 0.12),
                0 0 18px rgba(228, 154, 47, 0.08);
        }

        /* ================= BUTTONS ================= */

        button {
            border: none;
            border-radius: 12px;

            padding: 13px 18px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .view-btn {
            width: 100%;

            background: #e49a2f;
            color: #10291f;

            box-shadow:
                0 8px 20px rgba(228, 154, 47, 0.18);
        }

        .view-btn:hover {
            background: #f5b64e;

            box-shadow:
                0 10px 25px rgba(228, 154, 47, 0.28);
        }

        /* ================= NAVIGATION ================= */

        .navigation {
            display: flex;
            gap: 14px;
            margin-top: 18px;
        }

        .home-btn,
        .services-btn {
            flex: 1;

            background: #104534;
            color: #f7f4eb;

            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .home-btn:hover,
        .services-btn:hover {
            background: #0d3628;

            border-color: rgba(228, 154, 47, 0.35);
            color: #f5b64e;
        }

        /* ================= MESSAGE ================= */

        .message {
            margin-top: 22px;

            text-align: center;

            font-weight: bold;
            color: #f5b64e;

            min-height: 22px;
        }

        /* ================= BOOKING CARD ================= */

        .booking {
            background:
                linear-gradient(
                    145deg,
                    #0d3628,
                    #09231a
                );

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-left: 5px solid #e49a2f;

            padding: 24px;

            border-radius: 16px;

            margin-top: 22px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.25);

            transition: 0.25s ease;
        }

        .booking:hover {
            transform: translateY(-2px);

            border-color:
                rgba(228, 154, 47, 0.35);
        }

        .booking h3 {
            margin-top: 0;
            margin-bottom: 20px;

            color: #f5b64e;

            font-size: 20px;
        }

        .booking p {
            margin: 11px 0;

            color: #c8d3ce;

            line-height: 1.55;
        }

        .booking strong {
            color: #f7f4eb;
        }

        /* ================= STATUS ================= */

        .status {
            font-weight: bold;
            color: #f5b64e;
        }

        .status-btn {
            margin-top: 14px;

            background: #e49a2f;
            color: #10291f;

            box-shadow:
                0 6px 18px rgba(228, 154, 47, 0.15);
        }

        .status-btn:hover {
            background: #f5b64e;

            box-shadow:
                0 8px 22px rgba(228, 154, 47, 0.25);
        }

        /* ================= FOOTER ================= */

        footer {
            text-align: center;

            background: #03110d;

            color: #aebdb5;

            padding: 28px 20px;

            margin-top: 45px;

            border-top:
                1px solid rgba(255, 255, 255, 0.06);

            font-size: 14px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            header h1 {
                font-size: 24px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .dashboard-card {
                padding: 23px;
                border-radius: 20px;
            }

            .navigation {
                flex-direction: column;
            }

            .booking {
                padding: 19px;
            }

            .language-box {
                flex-direction: column;
            }
        }
    </style>

</head>

function translateService(service) {

    if (!service) {
        return getTranslation("notProvided");
    }

    const match =
        serviceTranslations[service];

    if (!match) {
        return service;
    }

    return match[currentLanguage] ||
           match.en ||
           service;
}


/* =========================================================
   LANGUAGE FUNCTIONS
========================================================= */

let currentLanguage =
    localStorage.getItem("quickfixLanguage") || "en";


function getTranslation(key) {

    const language =
        translations[currentLanguage] ||
        translations.en;

    return language[key] ||
           translations.en[key] ||
           key;

}


function applyLanguage() {

    document.documentElement.lang =
        currentLanguage;


    document
        .querySelectorAll("[data-i18n]")
        .forEach(element => {

            const key =
                element.getAttribute("data-i18n");

            element.textContent =
                getTranslation(key);

        });


    document
        .querySelectorAll("[data-i18n-placeholder]")
        .forEach(element => {

            const key =
                element.getAttribute(
                    "data-i18n-placeholder"
                );

            element.placeholder =
                getTranslation(key);

        });


    const languageSelect =
        document.getElementById("languageSelect");

    if (languageSelect) {
        languageSelect.value =
            currentLanguage;
    }

}


function changeLanguage(language) {

    currentLanguage =
        language;

    localStorage.setItem(
        "quickfixLanguage",
        currentLanguage
    );

    applyLanguage();

    /*
        If bookings are already visible,
        reload them so their labels,
        service names and statuses update too.
    */
    const bookingsDiv =
        document.getElementById("bookings");

    if (
        bookingsDiv &&
        bookingsDiv.children.length > 0
    ) {
        loadBookings();
    }

}


/* =========================================================
   NAVIGATION
========================================================= */

function goHome() {

    window.location.href =
        "home.html";

}


function goServices() {

    window.location.href =
        "services.html";

}


/* =========================================================
   STATUS TRANSLATION
========================================================= */

function translateStatus(status) {

    if (status === "Request Sent") {
        return getTranslation("requestSent");
    }

    if (status === "Helper Accepted") {
        return getTranslation("helperAccepted");
    }

    if (status === "On the Way") {
        return getTranslation("onTheWayStatus");
    }

    if (status === "Completed") {
        return getTranslation("completed");
    }

    return status || getTranslation("notAvailable");
}


/* =========================================================
   LOAD BOOKINGS
========================================================= */

async function loadBookings() {

    const helperName =
        document
            .getElementById("helperName")
            .value
            .trim();


    const bookingsDiv =
        document.getElementById("bookings");


    const message =
        document.getElementById("message");


    bookingsDiv.innerHTML =
        "";

    message.innerHTML =
        "";


    if (!helperName) {

        message.innerHTML =
            getTranslation("enterName");

        return;

    }


    try {

        const response =
            await fetch(
                "https://quickfix.pythonanywhere.com/api/helper/bookings?helper="
                + encodeURIComponent(helperName)
            );


        const result =
            await response.json();


        if (!response.ok) {

            message.innerHTML =
                result.message ||
                result.error ||
                getTranslation("couldNotLoad");

            return;

        }


        const bookings =
            result.bookings || [];


        if (bookings.length === 0) {

            message.innerHTML =
                getTranslation("noBookings");

            return;

        }


        message.innerHTML =
            getTranslation("bookingsFound")
            + " "
            + result.helper;


        bookings.forEach(booking => {

            const div =
                document.createElement("div");


            div.className =
                "booking";


            div.innerHTML = `

                <h3>
                    📋 ${getTranslation("booking")} #${booking.id}
                </h3>


                <p>
                    <strong>
                        ${getTranslation("customer")}:
                    </strong>

                    ${booking.user_id ||
                    getTranslation("notAvailable")}
                </p>


                <p>
                    <strong>
                        ${getTranslation("service")}:
                    </strong>

                    ${translateService(booking.service)}
                </p>


                <p>
                    <strong>
                        ${getTranslation("date")}:
                    </strong>

                    ${booking.date ||
                    getTranslation("notProvided")}
                </p>


                <p>
                    <strong>
                        ${getTranslation("time")}:
                    </strong>

                    ${booking.time ||
                    getTranslation("notProvided")}
                </p>


                <p>
                    <strong>
                        ${getTranslation("address")}:
                    </strong>

                    ${booking.address ||
                    getTranslation("notProvided")}
                </p>


                <p>
                    <strong>
                        ${getTranslation("phone")}:
                    </strong>

                    ${booking.phone ||
                    getTranslation("notProvided")}
                </p>


                <p>
                    <strong>
                        ${getTranslation("problem")}:
                    </strong>

                    ${booking.problem ||
                    getTranslation("notProvided")}
                </p>


                <p>
                    <strong>
                        ${getTranslation("status")}:
                    </strong>

                    <span class="status">
                        ${translateStatus(booking.status)}
                    </span>
                </p>


                <div id="status-${booking.id}">
                    ${getStatusButton(booking)}
                </div>

            `;


            bookingsDiv.appendChild(div);

        });

    }


    catch (error) {

        console.error(error);


        message.innerHTML =
            getTranslation("serverError");

    }

}


/* =========================================================
   STATUS BUTTON
========================================================= */

function getStatusButton(booking) {

    if (booking.status === "Request Sent") {

        return `

            <button
                class="status-btn"
                onclick="updateStatus(
                    ${booking.id},
                    'Helper Accepted'
                )">

                ${getTranslation("acceptRequest")}

            </button>

        `;

    }


    if (booking.status === "Helper Accepted") {

        return `

            <button
                class="status-btn"
                onclick="updateStatus(
                    ${booking.id},
                    'On the Way'
                )">

                ${getTranslation("onTheWay")}

            </button>

        `;

    }


    if (booking.status === "On the Way") {

        return `

            <button
                class="status-btn"
                onclick="updateStatus(
                    ${booking.id},
                    'Completed'
                )">

                ${getTranslation("markCompleted")}

            </button>

        `;

    }


    if (booking.status === "Completed") {

        return `

            <p style="
                color:#f5b64e;
                font-weight:bold;
            ">

                ${getTranslation("bookingCompleted")}

            </p>

        `;

    }


    return "";

}


/* =========================================================
   UPDATE BOOKING STATUS
========================================================= */

async function updateStatus(id, newStatus) {

    try {

        const response =
            await fetch(

                `https://quickfix.pythonanywhere.com/api/bookings/${id}/status`,

                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        status: newStatus
                    })
                }

            );


        const result =
            await response.json();


        if (!response.ok) {

            alert(
                result.message ||
                result.error ||
                getTranslation("couldNotUpdate")
            );

            return;

        }


        alert(
            result.message ||
            getTranslation("statusUpdated")
        );


        loadBookings();

    }


    catch (error) {

        console.error(error);


        alert(
            getTranslation("connectionError")
        );

    }

}


/* =========================================================
   INITIALIZE LANGUAGE
========================================================= */

applyLanguage();

</script>
