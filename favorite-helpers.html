<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fix Me - Favorite Helpers</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================
           PAGE
        ========================= */

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #022c22,
                #064e3b,
                #065f46
            );

            min-height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            background: #022c22;

            color: white;

            padding: 18px 35px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.25);
        }


        .logo {
            font-size: 28px;

            font-weight: bold;

            letter-spacing: 2px;
        }


        .top-navigation {
            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

            justify-content: flex-end;
        }


        .top-navigation button {
            padding: 9px 14px;

            background: #dcfce7;

            color: #166534;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;

            font-weight: bold;

            transition: 0.2s;
        }


        .top-navigation button:hover {
            background: #bbf7d0;

            transform: translateY(-1px);
        }


        .top-navigation .logout-button {
            background: #ef4444;

            color: white;
        }


        .top-navigation .logout-button:hover {
            background: #dc2626;
        }


        /* =========================
           MAIN PAGE
        ========================= */

        .home-page {
            min-height: calc(100vh - 145px);

            padding: 50px 25px;

            box-sizing: border-box;
        }


        /* =========================
           TITLE
        ========================= */

        .welcome {
            text-align: center;

            margin-bottom: 35px;
        }


        .favorite-title {
            color: white;

            font-size: 38px;

            margin-bottom: 10px;
        }


        .welcome p {
            color: #d1fae5;

            font-size: 17px;

            margin: 0;
        }


        /* =========================
           FAVORITE CARDS
        ========================= */

        .features {
            max-width: 1150px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(240px, 1fr));

            gap: 25px;
        }


        .feature-card {
            background: white;

            border-radius: 18px;

            padding: 25px 20px;

            text-align: center;

            box-shadow:
                0 10px 28px rgba(0, 0, 0, 0.18);

            transition: 0.3s;

            border: 2px solid transparent;
        }


        .feature-card:hover {
            transform: translateY(-7px);

            border-color: #86efac;

            box-shadow:
                0 15px 32px rgba(0, 0, 0, 0.24);
        }


        .feature-icon {
            font-size: 48px;

            margin-bottom: 10px;
        }


        .feature-card h2 {
            color: #166534;

            margin: 10px 0 8px;

            font-size: 22px;
        }


        .service-name {
            color: #15803d;

            font-size: 15px;

            font-weight: bold;

            margin: 5px 0;
        }


        .feature-card p {
            color: #64748b;

            line-height: 1.5;
        }


        .profile-rating {
            color: #d97706 !important;

            font-weight: bold;

            font-size: 16px;
        }


        /* =========================
           CARD BUTTONS
        ========================= */

        .feature-card button {
            width: 100%;

            padding: 11px;

            margin-top: 8px;

            background: #16a34a;

            color: white;

            border: none;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;

            transition: 0.3s;
        }


        .feature-card button:hover {
            background: #15803d;

            transform: translateY(-1px);
        }


        .feature-card .remove-button {
            background: #fff1f2;

            color: #be123c;

            border: 2px solid #fecdd3;
        }


        .feature-card .remove-button:hover {
            background: #ffe4e6;

            color: #9f1239;
        }


        /* =========================
           EMPTY MESSAGE
        ========================= */

        .empty-message {
            text-align: center;

            width: 100%;

            padding: 50px 20px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 10px 28px rgba(0, 0, 0, 0.18);

            box-sizing: border-box;
        }


        .empty-message h2 {
            color: #166534;

            margin-bottom: 10px;
        }


        .empty-message p {
            color: #64748b;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            background: #022c22;

            color: #d1fae5;

            text-align: center;

            padding: 18px 15px;

            font-size: 14px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .header {
                padding: 18px 20px;

                flex-direction: column;

                align-items: center;
            }


            .top-navigation {
                justify-content: center;
            }


            .favorite-title {
                font-size: 30px;
            }

        }


        @media (max-width: 500px) {

            .home-page {
                padding: 35px 15px;
            }


            .top-navigation button {
                font-size: 13px;

                padding: 8px 11px;
            }


            .favorite-title {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">


        <div class="logo">
            FIX ME
        </div>


        <div class="top-navigation">


            <button onclick="goHome()">
                Home
            </button>


            <button onclick="openQuickMatch()">
                Quick Match
            </button>


            <button onclick="openServices()">
                Services
            </button>


            <button
                class="logout-button"
                onclick="logout()"
            >
                Logout
            </button>


        </div>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main class="home-page">


        <section class="welcome">


            <h1 class="favorite-title">
                ❤️ Favorite Helpers
            </h1>


            <p>
                Your saved helpers are shown below.
            </p>


        </section>



        <section
            class="features"
            id="favoritesContainer"
        >

        </section>


    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer class="footer">


        <p>
            © 2026. Pranali Bhoyar & Mrunmayi Jadhav.
        </p>


    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        /* =========================
           HELPER PROFILES
        ========================= */

        const profiles = {


            "Electrician": [

                ["Rahul Patil", "⚡", "Electrical repairs & wiring", "4.9"],

                ["Amit Sharma", "⚡", "Home electrical services", "4.8"],

                ["Sagar More", "⚡", "Switches, fans & lights", "4.7"],

                ["Vijay Joshi", "⚡", "Wiring & appliance repair", "4.9"],

                ["Rohit Deshmukh", "⚡", "Electrical maintenance", "4.6"]

            ],


            "Plumber": [

                ["Akash Patil", "🔧", "Pipes & leakage repair", "4.9"],

                ["Nitin Sharma", "🔧", "Bathroom plumbing", "4.8"],

                ["Sameer More", "🔧", "Taps & pipe repair", "4.7"],

                ["Rajesh Joshi", "🔧", "Water supply repair", "4.9"],

                ["Vikas Deshmukh", "🔧", "Home plumbing services", "4.6"]

            ],


            "Tutor": [

                ["Priya Sharma", "📚", "School subjects", "4.9"],

                ["Sneha Patil", "📚", "Maths & Science", "4.8"],

                ["Neha Joshi", "📚", "English & languages", "4.7"],

                ["Pooja More", "📚", "Exam preparation", "4.9"],

                ["Anjali Deshmukh", "📚", "Homework support", "4.8"]

            ],


            "Carpenter": [

                ["Mahesh Patil", "🪚", "Furniture repair", "4.9"],

                ["Ramesh Sharma", "🪚", "Woodwork & fitting", "4.8"],

                ["Suresh More", "🪚", "Doors & cupboards", "4.7"],

                ["Ganesh Joshi", "🪚", "Furniture making", "4.9"],

                ["Prakash Deshmukh", "🪚", "Wood repairs", "4.6"]

            ],


            "Cleaner": [

                ["Kavita Patil", "🧹", "Home cleaning", "4.9"],

                ["Sunita Sharma", "🧹", "Room cleaning", "4.8"],

                ["Meena More", "🧹", "Deep cleaning", "4.7"],

                ["Rekha Joshi", "🧹", "Kitchen & bathroom cleaning", "4.9"],

                ["Asha Deshmukh", "🧹", "Regular home cleaning", "4.8"]

            ],


            "Moving Help": [

                ["Ravi Patil", "📦", "Packing & loading", "4.9"],

                ["Karan Sharma", "📦", "House shifting", "4.8"],

                ["Mohan More", "📦", "Furniture moving", "4.7"],

                ["Deepak Joshi", "📦", "Packing assistance", "4.9"],

                ["Sunil Deshmukh", "📦", "Loading & unloading", "4.6"]

            ]

        };



        /* =========================
           LOAD FAVORITES
        ========================= */

        let favorites = JSON.parse(
            localStorage.getItem("fixMeFavorites") || "[]"
        );



        const container =
            document.getElementById(
                "favoritesContainer"
            );



        /* =========================
           FIND HELPER
        ========================= */

        function findHelper(name, service) {


            if (!profiles[service]) {
                return null;
            }


            for (
                let i = 0;
                i < profiles[service].length;
                i++
            ) {


                if (
                    profiles[service][i][0] === name
                ) {

                    return profiles[service][i];

                }

            }


            return null;

        }



        /* =========================
           SHOW FAVORITES
        ========================= */

        function showFavorites() {


            container.innerHTML = "";


            if (favorites.length === 0) {


                container.innerHTML =

                    '<div class="empty-message">' +

                    '<h2>❤️ No Favorite Helpers Yet</h2>' +

                    '<p>' +

                    'Go to Services and add a helper to your favorites.' +

                    '</p>' +

                    '</div>';


                return;

            }



            for (
                let i = 0;
                i < favorites.length;
                i++
            ) {


                const favorite =
                    favorites[i];


                const helper =
                    findHelper(
                        favorite.name,
                        favorite.service
                    );


                if (!helper) {
                    continue;
                }



                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "feature-card";


                card.innerHTML =


                    '<div class="feature-icon">' +

                    helper[1] +

                    '</div>' +


                    '<h2>' +

                    helper[0] +

                    '</h2>' +


                    '<p class="service-name">' +

                    favorite.service +

                    '</p>' +


                    '<p>' +

                    helper[2] +

                    '</p>' +


                    '<p class="profile-rating">' +

                    '⭐ ' +

                    helper[3] +

                    ' / 5' +

                    '</p>' +


                    '<button onclick="viewProfile(\'' +

                    helper[0] +

                    '\', \'' +

                    favorite.service +

                    '\')">' +

                    'View Profile' +

                    '</button>' +


                    '<button class="remove-button" ' +

                    'onclick="removeFavorite(\'' +

                    helper[0] +

                    '\', \'' +

                    favorite.service +

                    '\')">' +

                    '❤️ Remove Favorite' +

                    '</button>';


                container.appendChild(card);

            }

        }



        /* =========================
           REMOVE FAVORITE
        ========================= */

        function removeFavorite(
            name,
            service
        ) {


            const newFavorites = [];


            for (
                let i = 0;
                i < favorites.length;
                i++
            ) {


                if (
                    favorites[i].name !== name ||
                    favorites[i].service !== service
                ) {

                    newFavorites.push(
                        favorites[i]
                    );

                }

            }


            favorites =
                newFavorites;


            localStorage.setItem(
                "fixMeFavorites",
                JSON.stringify(favorites)
            );


            showFavorites();

        }



        /* =========================
           VIEW PROFILE
        ========================= */

        function viewProfile(
            name,
            service
        ) {


            window.location.href =
                "helper-profile.html?name=" +
                encodeURIComponent(name) +
                "&service=" +
                encodeURIComponent(service);

        }



        /* =========================
           NAVIGATION
        ========================= */

        function goHome() {

            window.location.href =
                "home.html";

        }


        function openQuickMatch() {

            window.location.href =
                "quick-match.html";

        }


        function openServices() {

            window.location.href =
                "services.html";

        }


        function logout() {

            window.location.replace(
                "index.html"
            );

        }



        /* =========================
           SHOW FAVORITES
        ========================= */

        showFavorites();


    </script>


</body>

</html>
