.brand {

.tagline {

nav {

    gap: 18px;

    justify-content: center;

nav a,

    color: #d9e0db;
    background: transparent;
    padding: 0;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    transition: 0.25s;
}

nav a:hover,
.logout-btn:hover {
    color: #e49a2f;
}

nav a:nth-child(5) {
    color: #e49a2f;

.language-select {
    background: #0c3a2b;

    border-radius: 22px;
    outline: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 800;
    transition: 0.25s;
}

.language-select:hover {
    border-color: #e49a2f;
    box-shadow: 0 0 0 3px rgba(228,154,47,0.07);
}

.language-select option {
    background: #09231a;

}

.logout-btn {

}

.logout-btn:hover {
    background: #f5b64e;

.container {
    width: 92%;

.container::before {
    content: "";
    position: absolute;
    width: 420px;
    height: 420px;
    background: rgba(228,154,47,0.07);

.refresh-area {

.refresh-btn {

    background: #f5b64e;

.refresh-btn:disabled {

.booking-card {

.details strong {

    border-radius: 22px;
    background: rgba(228,154,47,0.10);

.timeline {

.step {

/* =========================================
   TRANSLATE SERVICE
========================================= */

function translateService(service) {

    if (
        service === null ||
        service === undefined
    ) {
        return "";
    }

    const serviceName =
        String(service).trim();

    const language =
        currentLanguage;

    if (
        serviceTranslations[language] &&
        serviceTranslations[language][serviceName]
    ) {
        return serviceTranslations[language][serviceName];
    }

    /*
       Case-insensitive fallback.
    */

    const matchingKey =
        Object.keys(
            serviceTranslations.en
        ).find(
            key =>
                key.toLowerCase() ===
                serviceName.toLowerCase()
        );

    if (matchingKey) {

        return (
            serviceTranslations[language]?.[matchingKey] ||
            serviceName
        );

    }

    /*
       Unknown/custom service:
       keep original database value.
    */

    return serviceName;
}

    if (
        !translations[currentLanguage]
    ) {
        currentLanguage = "en";
    }

    return translations[currentLanguage];
}


/* =========================================
   CHANGE LANGUAGE
========================================= */

function changeLanguage(language) {

    if (!translations[language]) {
        language = "en";
    }

    currentLanguage =
        language;

    localStorage.setItem(
        "quickfixLanguage",
        currentLanguage
    );

    applyLanguage();

    loadBookings();
}


/* =========================================
   APPLY LANGUAGE
========================================= */

function applyLanguage() {

    const lang =
        getLanguage();

    document.documentElement.lang =
        currentLanguage;

    document.getElementById(
        "tagline"
    ).textContent =
        lang.tagline;

    document.getElementById(
        "navHome"
    ).textContent =
        lang.home;

    document.getElementById(
        "navServices"
    ).textContent =
        lang.services;

    document.getElementById(
        "navQuickMatch"
    ).textContent =
        lang.quickMatch;

    document.getElementById(
        "navSnapFix"
    ).textContent =
        lang.snapFix;

    document.getElementById(
        "navMyFixes"
    ).textContent =
        lang.myFixes;

    document.getElementById(
        "logoutButton"
    ).textContent =
        lang.logout;

    const title =
        document.getElementById(
            "pageTitle"
        );

    if (
        currentLanguage === "en"
    ) {

        title.innerHTML =
            `My <span>Fixes</span>`;

    }

    else if (
        currentLanguage === "hi"
    ) {

        title.innerHTML =
            `मेरे <span>फिक्स</span>`;

    }

    else {

        title.innerHTML =
            `माझे <span>फिक्स</span>`;

    }

    document.getElementById(
        "pageSubtitle"
    ).textContent =
        lang.subtitle;

    const refreshButton =
        document.getElementById(
            "refreshButton"
        );

    if (
        !refreshButton.disabled
    ) {

        refreshButton.textContent =
            lang.refresh;

    }

    const selector =
        document.getElementById(
            "languageSelector"
        );

    if (selector) {
        selector.value =
            currentLanguage;
    }
}


/* =========================================
   CURRENT USER
========================================= */

let currentUser = null;

try {

    currentUser =
        JSON.parse(
            localStorage.getItem(
                "currentUser"
            ) || "null"
        );

    if (!currentUser) {

        currentUser =
            JSON.parse(
                localStorage.getItem(
                    "quickfixCurrentUser"
                ) || "null"
            );

    }

}

catch (error) {

    console.error(
        "User data error:",
        error
    );

    currentUser = null;
}


/* =========================================
   RATINGS
========================================= */

let selectedRatings = {};


/* =========================================
   STATUS TRANSLATION
========================================= */

function translateStatus(status) {

    const lang =
        getLanguage();

    const statusTranslations = {

        "Request Sent":
            lang.requestSent,

        "Helper Accepted":
            lang.helperAccepted,

        "On the Way":
            lang.onTheWay,

        "Completed":
            lang.completed

    };

    return (
        statusTranslations[status] ||
        status
    );
}


/* =========================================
   LOAD BOOKINGS
========================================= */

async function loadBookings() {

    const lang =
        getLanguage();

    const container =
        document.getElementById(
            "bookingsContainer"
        );

    container.innerHTML = `
        <div style="
            text-align:center;
            padding:40px;
            color:#aebdb5;
        ">
            ${lang.loading}
        </div>
    `;

    try {

        if (!currentUser) {

            throw new Error(
                "No logged-in user."
            );

        }

        const response =
            await fetch(
                `${API_URL}/api/bookings`
            );

        if (!response.ok) {

            throw new Error(
                "Unable to load bookings."
            );

        }

        const data =
            await response.json();

        const bookings =
            data.bookings || [];

        const userBookings =
            bookings.filter(
                booking =>
                    Number(
                        booking.user_id
                    ) ===
                    Number(
                        currentUser.id
                    )
            );

        if (
            userBookings.length === 0
        ) {

            container.innerHTML = `

                <div class="no-bookings">

                    <h2>
                        ${lang.noBookings}
                    </h2>

                    <p>
                        ${lang.noBookingsText}
                    </p>

                </div>

            `;

            return;
        }

        container.innerHTML = "";

        for (
            const booking of userBookings
        ) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "booking-card";

            /*
                IMPORTANT:
                booking.service is translated here.
                Helper name, address, phone and
                problem remain exactly as entered.
            */

            const translatedService =
                translateService(
                    booking.service
                );

            card.innerHTML = `

                <h2>
                    ${escapeHTML(
                        translatedService
                    )}
                </h2>

                <div class="details">

                    <strong>
                        ${lang.bookingId}
                    </strong>

                    ${escapeHTML(
                        booking.id
                    )}

                    <br>

                    <strong>
                        ${lang.helper}
                    </strong>

                    ${escapeHTML(
                        booking.helper
                    )}

                    <br>

                    <strong>
                        ${lang.date}
                    </strong>

                    ${escapeHTML(
                        booking.date
                    )}

                    <br>

                    <strong>
                        ${lang.time}
                    </strong>

                    ${escapeHTML(
                        booking.time
                    )}

                    <br>

                    <strong>
                        ${lang.address}
                    </strong>

                    ${escapeHTML(
                        booking.address
                    )}

                    <br>

                    <strong>
                        ${lang.phone}
                    </strong>

                    ${escapeHTML(
                        booking.phone
                    )}

                    <br>

                    <strong>
                        ${lang.problem}
                    </strong>

                    ${escapeHTML(
                        booking.problem
                    )}

                </div>

                <div class="status">

                    ${escapeHTML(
                        translateStatus(
                            booking.status
                        )
                    )}

                </div>

                <div class="timeline">

                    <div class="step">
                        ${lang.requestSent}
                    </div>

                    <div class="step">
                        ${lang.helperAccepted}
                    </div>

                    <div class="step">
                        ${lang.onTheWay}
                    </div>

                    <div class="step">
                        ${lang.completed}
                    </div>

                </div>

                <div
                    id="review-${booking.id}"
                ></div>

            `;

            container.appendChild(
                card
            );

            updateTimeline(
                booking.id,
                booking.status
            );

            if (
                booking.status ===
                "Completed"
            ) {

                await checkExistingReview(
                    booking,
                    document.getElementById(
                        `review-${booking.id}`
                    )
                );

            }

        }

    }

    catch (error) {

        console.error(
            "Load bookings error:",
            error
        );

        container.innerHTML = `

            <div class="no-bookings">

                <h2>
                    ${lang.unableBookings}
                </h2>

                <p>
                    ${lang.connectionProblem}
                </p>

            </div>

        `;

    }

}


/* =========================================
   REFRESH
========================================= */

async function refreshBookings() {

    const lang =
        getLanguage();

    const button =
        document.getElementById(
            "refreshButton"
        );

    button.disabled = true;

    button.textContent =
        lang.refreshing;

    await loadBookings();

    button.disabled = false;

    button.textContent =
        lang.refresh;
}


/* =========================================
   TIMELINE
========================================= */

function updateTimeline(
    bookingId,
    status
) {

    const reviewElement =
        document.getElementById(
            `review-${bookingId}`
        );

    if (!reviewElement) {
        return;
    }

    const card =
        reviewElement.parentElement;

    const steps =
        card.querySelectorAll(
            ".step"
        );

    const statusIndex = {

        "Request Sent": 0,

        "Helper Accepted": 1,

        "On the Way": 2,

        "Completed": 3

    };

    const currentIndex =
        statusIndex[status];

    steps.forEach(
        (
            step,
            index
        ) => {

            if (
                currentIndex !== undefined &&
                index <= currentIndex
            ) {

                step.classList.add(
                    "active"
                );

            }

            else {

                step.classList.remove(
                    "active"
                );

            }

        }
    );
}


/* =========================================
   CHECK EXISTING REVIEW
========================================= */

async function checkExistingReview(
    booking,
    reviewContainer
) {

    const lang =
        getLanguage();

    try {

        const response =
            await fetch(
                `${API_URL}/api/reviews?helper=${encodeURIComponent(
                    booking.helper
                )}`
            );

        if (!response.ok) {

            showReviewForm(
                booking,
                reviewContainer
            );

            return;

        }

        const data =
            await response.json();

        const reviews =
            Array.isArray(data)
                ? data
                : (
                    data.reviews ||
                    []
                );

        const existingReview =
            reviews.find(
                review =>
                    Number(
                        review.booking_id
                    ) ===
                    Number(
                        booking.id
                    )
            );

        if (existingReview) {

            reviewContainer.innerHTML = `

                <div class="reviewed">

                    <h3>
                        ${lang.reviewSubmitted}
                    </h3>

                    <p>

                        ${lang.youRated}

                        <strong>
                            ${escapeHTML(
                                booking.helper
                            )}
                        </strong>

                        ${escapeHTML(
                            existingReview.rating
                        )}/5

                    </p>

                    ${
                        existingReview.review
                            ? `

                                <p>
                                    "${escapeHTML(
                                        existingReview.review
                                    )}"
                                </p>

                              `
                            : ""
                    }

                    <p>
                        ${lang.thankYou}
                    </p>

                </div>

            `;

            return;
        }

        showReviewForm(
            booking,
            reviewContainer
        );

    }

    catch (error) {

        console.error(
            "Review check error:",
            error
        );

        showReviewForm(
            booking,
            reviewContainer
        );

    }

}


/* =========================================
   REVIEW FORM
========================================= */

function showReviewForm(
    booking,
    reviewContainer
) {

    const lang =
        getLanguage();

    selectedRatings[
        booking.id
    ] = 0;

    reviewContainer.innerHTML = `

        <div class="review-box">

            <h3>
                ${lang.rateHelper}
            </h3>

            <div class="stars">

                <span
                    class="star"
                    onclick="selectRating(
                        ${booking.id},
                        1
                    )"
                    id="star-${booking.id}-1"
                >
                    ★
                </span>

                <span
                    class="star"
                    onclick="selectRating(
                        ${booking.id},
                        2
                    )"
                    id="star-${booking.id}-2"
                >
                    ★
                </span>

                <span
                    class="star"
                    onclick="selectRating(
                        ${booking.id},
                        3
                    )"
                    id="star-${booking.id}-3"
                >
                    ★
                </span>

                <span
                    class="star"
                    onclick="selectRating(
                        ${booking.id},
                        4
                    )"
                    id="star-${booking.id}-4"
                >
                    ★
                </span>

                <span
                    class="star"
                    onclick="selectRating(
                        ${booking.id},
                        5
                    )"
                    id="star-${booking.id}-5"
                >
                    ★
                </span>

            </div>

            <textarea
                id="review-text-${booking.id}"
                placeholder="${lang.writeReview}"
            ></textarea>

            <button
                class="submit-btn"
                onclick="submitReview(
                    ${booking.id},
                    '${escapeForJS(
                        booking.helper
                    )}'
                )"
            >
                ${lang.submitReview}
            </button>

        </div>

    `;
}


/* =========================================
   SELECT RATING
========================================= */

function selectRating(
    bookingId,
    rating
) {

    selectedRatings[
        bookingId
    ] = rating;

    for (
        let i = 1;
        i <= 5;
        i++
    ) {

        const star =
            document.getElementById(
                `star-${bookingId}-${i}`
            );

        if (!star) {
            continue;
        }

        if (
            i <= rating
        ) {

            star.classList.add(
                "selected"
            );

        }

        else {

            star.classList.remove(
                "selected"
            );

        }

    }
}


/* =========================================
   SUBMIT REVIEW
========================================= */

async function submitReview(
    bookingId,
    helperName
) {

    const lang =
        getLanguage();

    const rating =
        selectedRatings[
            bookingId
        ] || 0;

    const reviewElement =
        document.getElementById(
            `review-text-${bookingId}`
        );

    const reviewText =
        reviewElement
            ? reviewElement.value.trim()
            : "";

    if (
        rating === 0
    ) {

        alert(
            lang.selectRating
        );

        return;
    }

    try {

        const response =
            await fetch(
                `${API_URL}/api/reviews`,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            booking_id:
                                bookingId,

                            user_id:
                                currentUser.id,

                            helper:
                                helperName,

                            rating:
                                rating,

                            review:
                                reviewText

                        })

                }
            );

        const data =
            await response.json();

        if (
            !response.ok
        ) {

            alert(
                data.error ||
                lang.unableReview
            );

            return;
        }

        alert(
            lang.reviewSuccess
        );

        await loadBookings();

    }

    catch (error) {

        console.error(
            "Submit review error:",
            error
        );

        alert(
            lang.backendConnection
        );

    }
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================
   ESCAPE JAVASCRIPT
========================================= */

function escapeForJS(value) {

    return String(
        value || ""
    )

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\n/g,
            "\\n"
        )

        .replace(
            /\r/g,
            "\\r"
        );
}


/* =========================================
   LOGOUT
========================================= */

function logout() {

    localStorage.removeItem(
        "currentUser"
    );

    localStorage.removeItem(
        "quickfixCurrentUser"
    );

    window.location.href =
        "index.html";
}


/* =========================================
   START
========================================= */

applyLanguage();

if (currentUser) {

    loadBookings();

}

else {

    const lang =
        getLanguage();

    alert(
        lang.loginFirst
    );

    window.location.href =
        "index.html";
}

</script>
