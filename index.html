<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickFix - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #061a14;
            --bg2: #09251c;
            --card: #0c3a2b;
            --card2: #092c21;
            --gold: #e49a2f;
            --gold-hover: #f5b64e;
            --text: #f7f4eb;
            --muted: #aebdb5;
            --input: #08291f;
            --border: rgba(228, 154, 47, 0.22);
            --danger: #ff7777;
            --success: #70d6a5;
        }


        /* =========================
           PAGE
        ========================= */

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 20px;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(228, 154, 47, 0.10),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(16, 69, 52, 0.55),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #061a14,
                    #09251c 55%,
                    #03110d
                );

            position: relative;

            overflow-x: hidden;
        }


        /* Decorative glow */

        body::before {

            content: "";

            position: fixed;

            width: 260px;

            height: 260px;

            border-radius: 50%;

            background: rgba(228, 154, 47, 0.05);

            filter: blur(50px);

            top: -100px;

            left: -80px;

            pointer-events: none;
        }


        body::after {

            content: "";

            position: fixed;

            width: 300px;

            height: 300px;

            border-radius: 50%;

            background: rgba(16, 69, 52, 0.20);

            filter: blur(60px);

            bottom: -120px;

            right: -100px;

            pointer-events: none;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 100%;

            max-width: 470px;

            position: relative;

            z-index: 2;
        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-box {

            background:
                linear-gradient(
                    145deg,
                    rgba(12, 58, 43, 0.98),
                    rgba(7, 39, 29, 0.98)
                );

            border:

                1px solid
                rgba(228, 154, 47, 0.18);

            border-radius: 28px;

            padding: 42px 40px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.48),
                0 0 40px rgba(228, 154, 47, 0.04);

            text-align: center;

            backdrop-filter: blur(10px);
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            font-size: 40px;

            font-weight: 900;

            letter-spacing: 4px;

            color: var(--text);

            margin-bottom: 8px;

            text-shadow:
                0 3px 20px rgba(0, 0, 0, 0.25);
        }


        .logo span {

            color: var(--gold);
        }


        /* =========================
           LOGO LINE
        ========================= */

        .logo-line {

            width: 62px;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    var(--gold),
                    var(--gold-hover)
                );

            border-radius: 20px;

            margin: 0 auto 18px;
        }


        /* =========================
           SUBTITLE
        ========================= */

        .subtitle {

            color: var(--muted);

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* =========================
           FORM GROUP
        ========================= */

        .form-group {

            text-align: left;

            margin-bottom: 19px;
        }


        .form-group label {

            display: block;

            font-size: 14px;

            font-weight: 700;

            color: #e7eee9;

            margin-bottom: 8px;
        }


        /* =========================
           INPUTS
        ========================= */

        .form-group input {

            width: 100%;

            padding: 14px 15px;

            background:
                rgba(3, 17, 13, 0.55);

            color: var(--text);

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius: 12px;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        .form-group input::placeholder {

            color: #70877c;
        }


        .form-group input:hover {

            border-color:
                rgba(228, 154, 47, 0.25);
        }


        .form-group input:focus {

            border-color: var(--gold);

            background:
                rgba(3, 17, 13, 0.72);

            box-shadow:
                0 0 0 3px
                rgba(228, 154, 47, 0.10);
        }


        /* =========================
           MAIN BUTTON
        ========================= */

        .login-button,
        .signup-button {

            width: 100%;

            padding: 14px;

            border-radius: 12px;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }


        .login-button {

            background:
                linear-gradient(
                    135deg,
                    var(--gold),
                    #d8861e
                );

            color: #14291f;

            border: none;

            margin-top: 4px;

            box-shadow:
                0 8px 22px
                rgba(228, 154, 47, 0.12);
        }


        .login-button:hover {

            background:
                linear-gradient(
                    135deg,
                    var(--gold-hover),
                    var(--gold)
                );

            transform: translateY(-2px);

            box-shadow:
                0 12px 28px
                rgba(228, 154, 47, 0.20);
        }


        .login-button:active {

            transform: translateY(0);
        }


        /* =========================
           SIGNUP BUTTON
        ========================= */

        .signup-button {

            background:
                rgba(228, 154, 47, 0.04);

            color: var(--gold-hover);

            border:
                1px solid
                rgba(228, 154, 47, 0.30);

            margin-top: 10px;
        }


        .signup-button:hover {

            background:
                rgba(228, 154, 47, 0.10);

            border-color: var(--gold);

            transform: translateY(-2px);
        }


        /* =========================
           DIVIDER
        ========================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 26px 0;

            color: #789086;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 1px;
        }


        .divider::before,
        .divider::after {

            content: "";

            height: 1px;

            background:
                rgba(255, 255, 255, 0.09);

            flex: 1;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {

            margin-top: 15px;

            font-size: 13px;

            min-height: 20px;

            font-weight: 700;

            line-height: 1.5;
        }


        /* =========================
           FOOTER NOTE
        ========================= */

        .footer-note {

            margin-top: 25px;

            font-size: 12px;

            color: #81968c;

            letter-spacing: 1px;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            text-align: center;

            margin-top: 20px;

            color: #70877c;

            font-size: 12px;

            line-height: 1.5;
        }


        footer strong {

            color: var(--gold);
        }


        /* =========================
           SIGNUP SECTION
        ========================= */

        #signupSection {

            display: none;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {

            background: none;

            border: none;

            color: var(--gold-hover);

            cursor: pointer;

            font-weight: 700;

            margin-bottom: 20px;

            font-size: 13px;

            transition: 0.25s;
        }


        .back-button:hover {

            color: var(--text);

            transform: translateX(-3px);
        }


        /* =========================
           SMALL TOP BADGE
        ========================= */

        .welcome-badge {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            padding: 7px 13px;

            border-radius: 30px;

            background:
                rgba(228, 154, 47, 0.08);

            border:
                1px solid
                rgba(228, 154, 47, 0.18);

            color: var(--gold-hover);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 1px;

            margin-bottom: 18px;

            text-transform: uppercase;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            body {

                padding: 20px 14px;
            }


            .login-box {

                padding: 34px 23px;

                border-radius: 23px;
            }


            .logo {

                font-size: 33px;

                letter-spacing: 3px;
            }


            .subtitle {

                font-size: 14px;
            }
        }


        @media (max-width: 360px) {

            .login-box {

                padding:
                    30px 18px;
            }


            .logo {

                font-size: 29px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <div class="login-box">


        <!-- =========================
             LOGIN SECTION
        ========================== -->

        <div id="loginSection">


            <div class="welcome-badge">
                ✦ QUICKFIX
            </div>


            <div class="logo">
                QUICK<span>FIX</span>
            </div>


            <div class="logo-line"></div>


            <p class="subtitle">
                Your Local Help, Anytime
            </p>


            <form id="loginForm">


                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Login

                </button>


            </form>


            <div class="divider">
                OR
            </div>


            <button
                type="button"
                class="signup-button"
                onclick="showSignup()">

                Create New Account

            </button>


            <div
                id="loginMessage"
                class="message">
            </div>


        </div>


        <!-- =========================
             SIGNUP SECTION
        ========================== -->

        <div id="signupSection">


            <button
                type="button"
                class="back-button"
                onclick="showLogin()">

                ← Back to Login

            </button>


            <div class="welcome-badge">
                ✦ JOIN QUICKFIX
            </div>


            <div class="logo">
                QUICK<span>FIX</span>
            </div>


            <div class="logo-line"></div>


            <p class="subtitle">
                Join QuickFix and find local help whenever you need it.
            </p>


            <form id="signupForm">


                <div class="form-group">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Create Account

                </button>


            </form>


            <div
                id="signupMessage"
                class="message">
            </div>


        </div>


        <p class="footer-note">
            Fast • Simple • Local
        </p>


    </div>


    <footer>

        © 2026 •
        <strong>
            Pranali Bhoyar and Mrunmayi Jadhav
        </strong>

    </footer>


</div>



<script>

const API_URL = "https://quickfix.pythonanywhere.com";


/* =========================
   LOGIN
========================= */

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim();


        const password =
            document
                .getElementById("loginPassword")
                .value;


        const message =
            document
                .getElementById("loginMessage");


        message.textContent =
            "Logging in...";


        message.style.color =
            "#aebdb5";


        try {

            const response =
                await fetch(
                    API_URL + "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email: email,
                                password: password
                            })
                    }
                );


            const data =
                await response.json();


            if (response.ok) {


                localStorage.setItem(
                    "currentUser",
                    JSON.stringify(data.user)
                );


                localStorage.setItem(
                    "quickfixCurrentUser",
                    JSON.stringify(data.user)
                );


                message.style.color =
                    "#70d6a5";


                message.textContent =
                    "Login successful!";


                setTimeout(function() {

                    window.location.href =
                        "home.html";

                }, 500);

            }


            else {

                message.style.color =
                    "#ff7777";


                message.textContent =
                    data.error ||
                    data.message ||
                    "Email or password is incorrect.";

            }

        }


        catch (error) {

            console.error(error);


            message.style.color =
                "#ff7777";


            message.textContent =
                "Cannot connect to QuickFix backend.";

        }

    });



/* =========================
   SIGNUP
========================= */

document
    .getElementById("signupForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("signupName")
                .value
                .trim();


        const email =
            document
                .getElementById("signupEmail")
                .value
                .trim();


        const password =
            document
                .getElementById("signupPassword")
                .value;


        const message =
            document
                .getElementById("signupMessage");


        message.textContent =
            "Creating account...";


        message.style.color =
            "#aebdb5";


        try {

            const response =
                await fetch(
                    API_URL + "/api/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                name: name,
                                email: email,
                                password: password
                            })
                    }
                );


            const data =
                await response.json();


            if (response.ok) {

                message.style.color =
                    "#70d6a5";


                message.textContent =
                    "Account created successfully!";


                document
                    .getElementById("signupForm")
                    .reset();


                setTimeout(function() {

                    showLogin();

                }, 1000);

            }


            else {

                message.style.color =
                    "#ff7777";


                message.textContent =
                    data.error ||
                    data.message ||
                    "Unable to create account.";

            }

        }


        catch (error) {

            console.error(error);


            message.style.color =
                "#ff7777";


            message.textContent =
                "Cannot connect to QuickFix backend.";

        }

    });



/* =========================
   SHOW SIGNUP
========================= */

function showSignup() {

    document
        .getElementById("loginSection")
        .style.display = "none";


    document
        .getElementById("signupSection")
        .style.display = "block";

}



/* =========================
   SHOW LOGIN
========================= */

function showLogin() {

    document
        .getElementById("signupSection")
        .style.display = "none";


    document
        .getElementById("loginSection")
        .style.display = "block";

}

</script>


</body>

</html>
